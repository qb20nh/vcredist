name: Collect candidate runtime evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - manifests/runtime-inputs.candidates.json
      - tools/Get-RuntimeInputEvidence.ps1
      - tools/RuntimeInputLock.ps1
      - tools/RuntimeInputPolicy.psm1
      - tests/Test-RuntimeInputEvidence.ps1
      - .github/workflows/runtime-input-evidence.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SOURCE_SHA }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Exercise evidence inventory preflight
        shell: pwsh
        run: ./tests/Test-RuntimeInputEvidence.ps1
      - name: Collect hashes and Microsoft signatures without installation
        shell: pwsh
        run: ./tools/Get-RuntimeInputEvidence.ps1
      - name: Retain metadata evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-input-evidence
          path: artifacts/runtime-input-evidence/evidence.json
          if-no-files-found: ignore
          retention-days: 90
