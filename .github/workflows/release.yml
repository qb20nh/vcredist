name: Build and publish verified release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Require a reviewed input lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path manifests/runtime-inputs.lock.json)) { throw 'Release requires manifests/runtime-inputs.lock.json.' }
          if ((Get-Content manifests/runtime-inputs.lock.json -Raw | ConvertFrom-Json).inputs.Count -eq 0) { throw 'Input lockfile is empty.' }
      - name: Confirm GitHub immutable releases are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $state = gh api "repos/${{ github.repository }}/immutable-releases" | ConvertFrom-Json
          if (-not $state.enabled) { throw 'Immutable releases must be enabled before release publication.' }
      - name: Restore locked toolchain and test policy
        run: |
          dotnet restore src/Bundle/RuntimePack.Bundle.wixproj --locked-mode
          dotnet run --project tests/RuntimeInstaller.Tests.csproj --configuration Release
      - name: Build all verified bootstrap and standalone bundles
        shell: pwsh
        run: |
          $bundleVersion = '${{ github.ref_name }}' -replace '^v', ''
          if ($bundleVersion -notmatch '^[0-9]+(\.[0-9]+){1,3}$') { throw 'Tag must be vMAJOR.MINOR.PATCH[.REVISION].' }
          ./tools/Build-Bundles.ps1 -LockFile manifests/runtime-inputs.lock.json -Mode Both -Architecture All -Version $bundleVersion
      - name: Gather bundles and release evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src/Bundle/bin/Release/*/*/*.exe artifacts/
          ./tools/New-ReleaseEvidence.ps1 -LockFile manifests/runtime-inputs.lock.json -ArtifactDirectory artifacts -OutputDirectory artifacts -Version ${{ github.ref_name }}
      - name: Attest the exact release binaries
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/*
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/* --verify-tag --generate-notes
