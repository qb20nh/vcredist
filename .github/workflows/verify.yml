name: Verify source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked toolchain
        run: dotnet restore src/Bundle/RuntimePack.Bundle.wixproj --locked-mode
      - name: Exercise selection policy
        run: dotnet run --project tests/RuntimeInstaller.Tests.csproj --configuration Release
      - name: Exercise release evidence filename validation
        shell: pwsh
        run: ./tests/Test-ReleaseEvidence.ps1
      - name: Exercise Burn authoring input policy
        shell: pwsh
        run: ./tests/Test-BurnAuthoringInputPolicy.ps1
      - name: Exercise runtime input trust boundary
        shell: pwsh
        run: ./tests/Test-RuntimeInputLock.ps1
      - name: Exercise runtime input trust boundary under Windows PowerShell
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Test-RuntimeInputLock.ps1
      - name: Exercise runtime input evidence preflight
        shell: pwsh
        run: ./tests/Test-RuntimeInputEvidence.ps1
      - name: Validate the candidate inventory without downloading payloads
        shell: pwsh
        run: ./tools/Get-RuntimeInputEvidence.ps1 -ValidateOnly
      - name: Compile all native bootstrap architectures with a non-installable fixture
        shell: pwsh
        run: >-
          ./tools/Build-Bundles.ps1 -LockFile tests/fixtures/runtime-inputs.bootstrap-fixture.json
          -Mode Bootstrap -Architecture All -Version 0.0.0
      - name: Verify native architecture and the non-mutating NetFx3 self-test
        shell: pwsh
        run: ./tests/Test-NativeArtifacts.ps1 -Version 0.0.0
